name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Enforce qgis.PyQt runtime imports
        run: |
          if grep -R --line-number --include='*.py' -E '^\s*(from|import)\s+PyQt5' Delft3DFileManager; then
            echo "Direct PyQt5 import detected in plugin runtime code. Use qgis.PyQt imports instead."
            exit 1
          fi

      - name: Run Qt compatibility guard
        run: pytest tests/test_qt_compatibility.py -v

      - name: Run tests
        run: >-
          python -m pytest tests/ -v
          --cov=Delft3DFileManager
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
